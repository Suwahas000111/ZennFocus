name: Build ZenFocus APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Organize Android Project Structure
        run: |
          mkdir -p app/src/main/java/com/zenfocus/app
          mkdir -p app/src/main
          
          if [ -f "MainActivity.kt" ]; then mv MainActivity.kt app/src/main/java/com/zenfocus/app/; fi
          if [ -f "FocusTimerService.kt" ]; then mv FocusTimerService.kt app/src/main/java/com/zenfocus/app/; fi
          if [ -f "AndroidManifest.xml" ]; then mv AndroidManifest.xml app/src/main/; fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Initialize Gradle Wrapper
        run: |
          gradle wrapper --gradle-version 8.10.2
          chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload ZenFocus APK
        uses: actions/upload-artifact@v4
        with:
          name: ZenFocus-APK
          path: app/build/outputs/apk/debug/app-debug.apk
